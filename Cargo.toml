# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name            = "minidl"
version         = "0.0.0-git"
authors         = ["MaulingMonkey <git@maulingmonkey.com>"]
description     = "Extremely lean cross platform library for loading symbols"
repository      = "https://github.com/MaulingMonkey/minidl"
documentation   = "https://docs.rs/minidl"
edition         = "2021" # https://doc.rust-lang.org/edition-guide/rust-2021/c-string-literals.html
keywords        = ["dlopen", "LoadLibrary", "dlsym", "dll", "so"]
categories      = ["external-ffi-bindings"]
license         = "MIT OR Apache-2.0"
readme          = "Readme.md"
include         = ["/**/*.rs", "/Cargo.toml", "/LICENSE-MIT", "/LICENSE-APACHE", "Readme.md"]
rust-version    = "1.79" # https://doc.rust-lang.org/std/num/struct.NonZero.html

[badges]
maintenance     = { status = "experimental" }

[features]
default         = ["std"]
std             = ["alloc"]
alloc           = []

[dependencies]
winresult       = { version = "0.1.3", optional = true }

[dev-dependencies]
dev.path        = "dev"
winresult       = "0.1.3"

[lib]
path            = "src/_lib.rs"
